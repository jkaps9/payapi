<form
  id="demo-{{ title }}"
  class="demo"
>
  <div class="form-group">
    <label
      for="email-demo"
      class="sr-only"
    >
      Email Address
    </label>
    <input
      id="email-demo"
      name="email"
      type="email"
      placeholder="Enter email address"
      autocomplete="email"
      required
    />
    <button
      class="btn btn--primary"
      type="submit"
    >
      Schedule a Demo
    </button>
  </div>
</form>
